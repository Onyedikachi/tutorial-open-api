version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openbanking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

# mTLS termination and the API gateway now live in the sibling
# tutorial-open-banking-api-gateway repo, which proxies here over the
# internal network using INTERNAL_GATEWAY_SECRET (see .env.example and
# GatewayTrustMiddleware). This backend is no longer meant to be reachable
# from TPPs directly - only :3000's browser-facing /auth/* journey is.

volumes:
  postgres_data: