version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openbanking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # mTLS gateway (matls.*) in front of the API - run
  # certs/generate-dev-certs.sh once before starting this service.
  # The API itself keeps running on the host via `npm run start:dev` and
  # stays reachable directly on :3000 for the browser-based demo frontend,
  # which never presents a client certificate. See nginx/mtls-gateway.conf.
  mtls-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/mtls-gateway.conf:/etc/nginx/conf.d/mtls-gateway.conf:ro
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: