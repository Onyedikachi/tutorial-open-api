openapi: 3.1.0

info:
  title: Open Banking Nigeria API (AISP & PISP)
  description: |
    # Open Banking Nigeria API
    CBN-compliant Account Information (AISP) and Payment Initiation (PISP)
    API for authorized Third Party Providers (TPPs), implementing the
    access-rule categories from the CBN Operational Guidelines for Open
    Banking in Nigeria:

    - **AIS** - account/balance/transaction/statement read access
    - **PIST** - Payment Initiation Single Transfer
    - **PIFT** - Payment Initiation Future-dated Transfer
    - **MIT** - Merchant Initiated Transaction
    - **PAST** - Payment Account Statement Transfer

    ## Key Features
    - **Account Discovery**: List accounts with detailed metadata
    - **Transaction History**: Retrieve transactions with rich filtering
    - **Balance Information**: Real-time account balances
    - **Payment Initiation**: Single, future-dated and merchant-initiated transfers
    - **Beneficiary Management**: Access payee information
    - **Direct Debits & Standing Orders**: View recurring payments

    ## Version Information
    - Current Version: 1.0.0
    - CBN Open Banking Nigeria Compliance: Yes
    - FAPI Compliant: Yes (Read/Write)

    ## Security
    - Every resource and payment call requires **both** a certificate-bound
      OAuth2 access token (Authorization Code + PKCE, S256 only) **and**
      mutual TLS on the `matls.` host - see the `oauth2` and `mutualTLS`
      security schemes below, which are combined (AND), not alternatives.
    - Use `x-fapi-interaction-id` for request tracing.
    - `Idempotency-Key` is required on all payment-initiating POST requests.
    - Rate limits apply (see documentation).
    - RFC 7807 (`application/problem+json`) error responses for all 4xx/5xx errors.

    ## Support
    - Developer Portal: [https://developer.openbanking.ng](https://developer.openbanking.ng)
    - API Status: [https://status.openbanking.ng](https://status.openbanking.ng)
    - Email: api-support@openbanking.ng

  version: 1.0.0
  termsOfService: https://openbanking.ng/api/terms
  contact:
    name: Open Banking Nigeria API Support
    email: api-support@openbanking.ng
    url: https://developer.openbanking.ng/support
  license:
    name: CBN Open Banking Nigeria Operational Guidelines
    url: https://www.cbn.gov.ng/Out/2021/CCD/Operational%20Guidelines%20for%20Open%20Banking%20in%20Nigeria.pdf

servers:
  - url: https://rs.openbanking.ng/v1
    description: Bank backend - OAuth2 authorization/consent journey only (browser-facing, TLS 1.3, no client certificate)
  - url: https://matls.rs.openbanking.ng/v1
    description: tutorial-open-banking-api-gateway - AISP/PISP resource and payment calls (mTLS + OAuth2 required). Terminates mTLS and enforces product entitlement/rate limiting before proxying to the bank backend.
  - url: https://sandbox.openbanking.ng/v1
    description: Sandbox Environment (mTLS + OAuth2 required, test CA)
  - url: http://localhost:3000
    description: Local development - bank backend (browser-facing /auth/* journey only)
  - url: https://localhost:8443
    description: Local development - api gateway (mTLS). See tutorial-open-banking-api-gateway/certs/generate-dev-certs.sh

tags:
  - name: Authorization
    description: OAuth2 Authorization Code + PKCE flow, consent management, and OIDC discovery
  - name: Payments
    description: PISP payment initiation and lifecycle (PIST single transfer, PIFT future-dated transfer)
  - name: AccessRules
    description: CBN access-rule category endpoints (PIST/MIT/PIFT/PAST) gated by TPP-granted permissions
  - name: Accounts
    description: Operations for retrieving account information
    externalDocs:
      description: Account Information Guide
      url: https://developer.openbanking.ng/docs/accounts
  - name: Balances
    description: Operations for retrieving account balances
  - name: Transactions
    description: Operations for retrieving transaction history
  - name: Statements
    description: PAST - account statement retrieval for a TPP-authorized account
  - name: Beneficiaries
    description: Operations for retrieving beneficiary information
  - name: DirectDebits
    description: Operations for retrieving direct debit mandates
  - name: StandingOrders
    description: Operations for retrieving standing orders
  - name: Products
    description: Operations for retrieving product details
  - name: Offers
    description: Operations for retrieving account offers
  - name: Parties
    description: Operations for retrieving party information
  - name: ScheduledPayments
    description: Operations for retrieving scheduled payments

paths:
  /accounts:
    get:
      summary: Get list of accounts
      description: |
        Returns a list of accounts that the PSU has authorised the TPP to access.
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadAccountsBasic` or `ReadAccountsDetail`
        
        ## Pagination
        - Default page size: 50
        - Maximum page size: 200
        - Use `page` and `limit` query parameters
      operationId: getAccounts
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/from-creation-date'
        - $ref: '#/components/parameters/to-creation-date'
      responses:
        '200':
          description: Successfully retrieved accounts
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
            x-pagination-total:
              schema:
                type: integer
                description: Total number of accounts
            x-pagination-page:
              schema:
                type: integer
                description: Current page number
            x-pagination-limit:
              schema:
                type: integer
                description: Page size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              examples:
                basic-accounts:
                  $ref: '#/components/examples/basic-accounts'
                detailed-accounts:
                  $ref: '#/components/examples/detailed-accounts'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '415':
          $ref: '#/components/responses/415Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}:
    get:
      summary: Get specific account details
      description: |
        Returns detailed information for a specific account.
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadAccountsDetail`
      operationId: getAccountById
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          description: Successfully retrieved account details
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/balances:
    get:
      summary: Get account balances
      description: |
        Returns current and available balances for a specific account.
        
        ## Balance Types
        - **InterimAvailable**: Available balance for transactions
        - **InterimBooked**: Confirmed transactions balance
        - **Expected**: Expected balance including pending items
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadBalances`
      operationId: getAccountBalances
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          description: Successfully retrieved balances
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                Data:
                  Balance:
                    - AccountId: "1234567890"
                      Amount:
                        Amount: "1500.00"
                        Currency: "GBP"
                      CreditDebitIndicator: "Credit"
                      Type: "InterimAvailable"
                      DateTime: "2026-03-09T10:30:00Z"
                    - AccountId: "1234567890"
                      Amount:
                        Amount: "1425.50"
                        Currency: "GBP"
                      CreditDebitIndicator: "Credit"
                      Type: "InterimBooked"
                      DateTime: "2026-03-09T10:30:00Z"
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '429':
          $ref: '#/components/responses/429Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/transactions:
    get:
      summary: Get account transactions
      description: |
        Returns transaction history for a specific account with comprehensive filtering.
        
        ## Filtering Options
        - **Date range**: `fromBookingDate` and `toBookingDate`
        - **Transaction type**: Credit/Debit filtering
        - **Amount range**: Minimum/maximum amounts
        - **Transaction status**: Booked/Pending
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadTransactionsBasic` or `ReadTransactionsDetail`
        
        ## Rate Limiting
        - 100 requests per minute per TPP
        - Maximum date range: 90 days
      operationId: getAccountTransactions
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/from-booking-date'
        - $ref: '#/components/parameters/to-booking-date'
        - $ref: '#/components/parameters/from-statement-date'
        - $ref: '#/components/parameters/to-statement-date'
        - $ref: '#/components/parameters/from-amount'
        - $ref: '#/components/parameters/to-amount'
        - $ref: '#/components/parameters/credit-debit-indicator'
        - $ref: '#/components/parameters/transaction-status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved transactions
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
            x-pagination-total:
              schema:
                type: integer
                description: Total number of transactions
            x-pagination-page:
              schema:
                type: integer
                description: Current page number
            x-pagination-limit:
              schema:
                type: integer
                description: Page size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                recent-transactions:
                  $ref: '#/components/examples/recent-transactions'
                paginated-transactions:
                  $ref: '#/components/examples/paginated-transactions'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '422':
          $ref: '#/components/responses/422Error'
        '429':
          $ref: '#/components/responses/429Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/beneficiaries:
    get:
      summary: Get account beneficiaries
      description: Returns list of beneficiaries/payees for an account
      operationId: getAccountBeneficiaries
      tags:
        - Beneficiaries
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved beneficiaries
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/direct-debits:
    get:
      summary: Get direct debit mandates
      description: Returns active direct debit mandates for an account
      operationId: getAccountDirectDebits
      tags:
        - DirectDebits
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved direct debits
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/standing-orders:
    get:
      summary: Get standing orders
      description: Returns active standing orders for an account
      operationId: getAccountStandingOrders
      tags:
        - StandingOrders
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved standing orders
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/offers:
    get:
      summary: Get account offers
      description: Returns current offers and promotions for an account
      operationId: getAccountOffers
      tags:
        - Offers
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved offers
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/party:
    get:
      summary: Get account party information
      description: Returns information about the account holder
      operationId: getAccountParty
      tags:
        - Parties
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved party information
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/scheduled-payments:
    get:
      summary: Get scheduled payments
      description: Returns future-dated scheduled payments for an account
      operationId: getAccountScheduledPayments
      tags:
        - ScheduledPayments
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/from-scheduled-date'
        - $ref: '#/components/parameters/to-scheduled-date'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved scheduled payments
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPaymentResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /accounts/{AccountId}/product:
    get:
      summary: Get account product details
      description: Returns product information associated with the account
      operationId: getAccountProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved product details
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /balances:
    get:
      summary: Get bulk balances
      description: Returns balances for multiple accounts in a single request
      operationId: getBulkBalances
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/account-ids'
        - $ref: '#/components/parameters/balance-types'
      responses:
        '200':
          description: Successfully retrieved bulk balances
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkBalanceResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /auth/authorize:
    get:
      summary: Start the OAuth2 Authorization Code + PKCE flow
      description: |
        Redirects the PSU's browser into the TPP's consent journey after
        validating PKCE parameters (S256 only). Browser-facing - no access
        token or client certificate exists yet, so this is unauthenticated.
      operationId: authorize
      tags: [Authorization]
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          schema: { type: string, enum: [S256] }
        - name: nonce
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to the TPP's consent UI with a consentId
        '400':
          $ref: '#/components/responses/400Error'

  /auth/token:
    post:
      summary: Exchange an authorization code or refresh token for an access token
      operationId: token
      tags: [Authorization]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequestBody'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'

  /auth/consent:
    post:
      summary: Record the PSU's consent decision
      description: Called by the TPP's frontend after the PSU approves or denies the requested permissions/accounts.
      operationId: submitConsent
      tags: [Authorization]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequestBody'
      responses:
        '200':
          description: Consent processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '404':
          $ref: '#/components/responses/404Error'

  /auth/consent/{consentId}:
    get:
      summary: Get consent request details
      operationId: getConsentDetails
      tags: [Authorization]
      security: []
      parameters:
        - name: consentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Consent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDetails'
        '404':
          $ref: '#/components/responses/404Error'

  /auth/.well-known/openid-configuration:
    get:
      summary: OIDC discovery document
      operationId: getOpenIdConfiguration
      tags: [Authorization]
      security: []
      responses:
        '200':
          description: OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfiguration'

  /auth/jwks:
    get:
      summary: JSON Web Key Set for verifying access token signatures
      description: |
        Publishes this bank's RS256 public signing key. Fetched and cached
        by tutorial-open-banking-api-gateway so it can verify Bearer tokens
        itself, independent of this backend, on every proxied call.
      operationId: getJwks
      tags: [Authorization]
      security: []
      responses:
        '200':
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'

  /payments:
    post:
      summary: Initiate a single immediate payment (PIST)
      description: |
        CBN access rule **PIST** (Payment Initiation Single Transfer).
        Requires the `pist_access` grant on the calling TPP's Open Banking
        Registry record, verified via the mTLS client certificate.
      operationId: initiatePayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ISO20022Payment'
      responses:
        '201':
          description: Payment accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiationResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '409':
          $ref: '#/components/responses/409Error'
        '422':
          $ref: '#/components/responses/422Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /payments/{paymentId}/status:
    get:
      summary: Get payment status
      operationId: getPaymentStatus
      tags: [Payments]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /payments/{paymentId}/reverse:
    post:
      summary: Reverse a previously initiated payment
      operationId: reversePayment
      tags: [Payments]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reversal accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReversalResponse'
        '401':
          $ref: '#/components/responses/401Error'
        '404':
          $ref: '#/components/responses/404Error'
        '409':
          $ref: '#/components/responses/409Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /payments/pift/schedule:
    post:
      summary: Schedule a future-dated payment (PIFT)
      description: |
        CBN access rule **PIFT** (Payment Initiation Future-dated
        Transfer). Requires the `pift_access` grant. `executionDate` must
        be in the future - this endpoint also requires the nested
        JWS+JWE ("EncryptedJWT") bearer token in addition to the plain
        OAuth2 + mTLS requirement below (see JwtEncryptionMiddleware).
      operationId: scheduleFuturePayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturePaymentRequest'
      responses:
        '201':
          description: Payment scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiationResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '409':
          $ref: '#/components/responses/409Error'
        '422':
          $ref: '#/components/responses/422Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /gateway/pist/status:
    get:
      summary: PIST access-rule probe
      description: Returns 200 only if the calling TPP has been granted `pist_access`.
      operationId: gatewayPistStatus
      tags: [AccessRules]
      responses:
        '200':
          description: PIST access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleStatus'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /gateway/mit/initiate:
    post:
      summary: MIT access-rule probe
      description: Returns 200 only if the calling TPP has been granted `mit_access` (Merchant Initiated Transaction).
      operationId: gatewayMitInitiate
      tags: [AccessRules]
      responses:
        '200':
          description: MIT initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleStatus'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /gateway/pift/schedule:
    post:
      summary: PIFT access-rule probe
      description: Returns 200 only if the calling TPP has been granted `pift_access`.
      operationId: gatewayPiftSchedule
      tags: [AccessRules]
      responses:
        '200':
          description: PIFT scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleStatus'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - payments_initiate
          mutualTLS: []

  /gateway/past/statements:
    get:
      summary: PAST access-rule probe
      description: Returns 200 only if the calling TPP has been granted `past_access`.
      operationId: gatewayPastStatements
      tags: [AccessRules]
      responses:
        '200':
          description: PAST statements retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleStatus'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

  /past/accounts/{accountId}/statement:
    get:
      summary: Get an account statement (PAST)
      description: |
        CBN access rule **PAST** (Payment Account Statement Transfer).
        Requires an approved consent (`X-Consent-ID`) whose `accounts`
        list includes `accountId` and whose scope includes
        `accounts_read`, in addition to the TPP-level OAuth2 + mTLS below.
      operationId: getAccountStatement
      tags: [Statements]
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ConsentId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statement transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatementResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
      security:
        - oauth2:
            - accounts_read
          mutualTLS: []

components:
  schemas:
    # Account Schemas
    AccountResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Account
          properties:
            Account:
              type: array
              items:
                $ref: '#/components/schemas/Account'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'

    Account:
      type: object
      required:
        - AccountId
        - Currency
        - AccountType
        - AccountSubType
      properties:
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique identifier for the account
          example: "1234567890"
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code
          example: "GBP"
        AccountType:
          type: string
          enum:
            - Business
            - Personal
            - Joint
          description: Type of account
        AccountSubType:
          type: string
          enum:
            - CurrentAccount
            - SavingsAccount
            - CreditCard
            - Loan
            - Mortgage
          description: Sub-type of account
        Description:
          type: string
          maxLength: 35
          description: Description of the account
          example: "Mr John Smith Personal Account"
        Nickname:
          type: string
          maxLength: 70
          description: Nickname given by account holder
          example: "Main spending"
        Account:
          type: array
          description: Account identification details
          minItems: 1
          items:
            $ref: '#/components/schemas/AccountIdentification'
        Servicer:
          $ref: '#/components/schemas/Servicer'

    AccountDetailResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Account
          properties:
            Account:
              type: array
              items:
                $ref: '#/components/schemas/AccountDetail'

    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            Status:
              type: string
              enum:
                - Enabled
                - Disabled
                - Deleted
              description: Account status
            StatusUpdateDateTime:
              type: string
              format: date-time
              description: Last status update timestamp
            OpeningDate:
              type: string
              format: date
              description: Date account was opened
            MaturityDate:
              type: string
              format: date
              description: Maturity date for term accounts
            SwitchStatus:
              type: string
              enum:
                - None
                - Incoming
                - Outgoing
              description: Account switching service status

    AccountIdentification:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - NG.OBN.SortCodeAccountNumber
            - NG.OBN.IBAN
            - NG.OBN.PAN
            - NG.OBN.MaskedPAN
            - NG.OBN.BBAN
            - NG.OBN.Paym
          description: Account identification scheme
        Identification:
          type: string
          minLength: 1
          maxLength: 256
          description: Account identifier (format depends on SchemeName)
          example: "12345678901234"
        Name:
          type: string
          maxLength: 70
          description: Name of the account holder
          example: "Mr John Smith"
        SecondaryIdentification:
          type: string
          maxLength: 34
          description: Secondary identification (e.g., roll number)
          example: "Roll12345"

    Servicer:
      type: object
      required:
        - SchemeName
        - Identification
      properties:
        SchemeName:
          type: string
          enum:
            - NG.OBN.BICFI
            - NG.OBN.BankCode
          description: Servicer identification scheme
        Identification:
          type: string
          minLength: 1
          maxLength: 256
          description: Servicer identifier
          example: "MIDLGB22"

    # Balance Schemas
    BalanceResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Balance
          properties:
            Balance:
              type: array
              items:
                $ref: '#/components/schemas/Balance'

    Balance:
      type: object
      required:
        - AccountId
        - Amount
        - CreditDebitIndicator
        - Type
        - DateTime
      properties:
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
          description: Account identifier
          example: "1234567890"
        Amount:
          $ref: '#/components/schemas/Amount'
        CreditDebitIndicator:
          type: string
          enum:
            - Credit
            - Debit
          description: Indicates if balance is credit or debit
        Type:
          type: string
          enum:
            - ClosingAvailable
            - ClosingBooked
            - Expected
            - ForwardAvailable
            - Information
            - InterimAvailable
            - InterimBooked
            - OpeningAvailable
            - OpeningBooked
            - PreviouslyClosedBooked
          description: Type of balance
        DateTime:
          type: string
          format: date-time
          description: Date and time of the balance
        CreditLine:
          type: array
          description: Credit line information
          items:
            $ref: '#/components/schemas/CreditLine'

    Amount:
      type: object
      required:
        - Amount
        - Currency
      properties:
        Amount:
          type: string
          pattern: '^-?\d{1,13}\.\d{2}$'
          description: Monetary value with 2 decimal places
          example: "1250.75"
        Currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code
          example: "GBP"

    CreditLine:
      type: object
      required:
        - Included
      properties:
        Included:
          type: boolean
          description: Whether the credit line is included in balance
        Amount:
          $ref: '#/components/schemas/Amount'
        Type:
          type: string
          enum:
            - Available
            - Credit
            - Emergency
            - Pre-Agreed
            - Temporary
          description: Type of credit line

    # Transaction Schemas
    TransactionResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Transaction
          properties:
            Transaction:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'

    Transaction:
      type: object
      required:
        - AccountId
        - TransactionId
        - Amount
        - CreditDebitIndicator
        - Status
        - BookingDateTime
      properties:
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
          description: Account identifier
        TransactionId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique transaction identifier
          example: "TX20260309123456"
        TransactionReference:
          type: string
          maxLength: 35
          description: Reference provided by the creditor
          example: "PAYMENT-123456"
        Amount:
          $ref: '#/components/schemas/Amount'
        CreditDebitIndicator:
          type: string
          enum:
            - Credit
            - Debit
        Status:
          type: string
          enum:
            - Booked
            - Pending
            - Rejected
        BookingDateTime:
          type: string
          format: date-time
          description: Date and time when transaction was booked
        ValueDateTime:
          type: string
          format: date-time
          description: Value date for interest calculation
        TransactionInformation:
          type: string
          maxLength: 500
          description: Description of the transaction
          example: "TESCO STORE 123 LONDON"
        AddressLine:
          type: string
          maxLength: 70
          description: Address line for the transaction
        BankTransactionCode:
          $ref: '#/components/schemas/BankTransactionCode'
        ProprietaryBankTransactionCode:
          $ref: '#/components/schemas/ProprietaryBankTransactionCode'
        Balance:
          $ref: '#/components/schemas/TransactionBalance'
        MerchantDetails:
          $ref: '#/components/schemas/MerchantDetails'
        CreditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        CreditorAccount:
          $ref: '#/components/schemas/AccountIdentification'
        DebtorAgent:
          $ref: '#/components/schemas/DebtorAgent'
        DebtorAccount:
          $ref: '#/components/schemas/AccountIdentification'
        SupplementaryData:
          type: object
          description: Additional transaction data

    BankTransactionCode:
      type: object
      properties:
        Code:
          type: string
          description: ISO 20022 bank transaction code
          example: "PMNT"
        SubCode:
          type: string
          description: ISO 20022 bank transaction sub-code
          example: "ICDT"

    ProprietaryBankTransactionCode:
      type: object
      properties:
        Code:
          type: string
          description: Bank proprietary transaction code
          example: "POS"
        Issuer:
          type: string
          description: Issuer of the proprietary code
          example: "BANK"

    TransactionBalance:
      type: object
      properties:
        Amount:
          $ref: '#/components/schemas/Amount'
        CreditDebitIndicator:
          type: string
          enum:
            - Credit
            - Debit
        Type:
          type: string
          enum:
            - InterimBooked
            - InterimAvailable
          description: Balance type after transaction

    MerchantDetails:
      type: object
      properties:
        MerchantName:
          type: string
          maxLength: 350
          example: "Tesco"
        MerchantCategoryCode:
          type: string
          pattern: '^\d{4}$'
          description: MCC code
          example: "5411"

    CreditorAgent:
      type: object
      properties:
        SchemeName:
          type: string
          enum:
            - NG.OBN.BICFI
        Identification:
          type: string
          example: "MIDLGB22"
        Name:
          type: string
          maxLength: 140
          example: "HSBC UK"

    DebtorAgent:
      type: object
      properties:
        SchemeName:
          type: string
          enum:
            - NG.OBN.BICFI
        Identification:
          type: string
          example: "BARCGB22"
        Name:
          type: string
          maxLength: 140

    # Beneficiary Schemas
    BeneficiaryResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Beneficiary
          properties:
            Beneficiary:
              type: array
              items:
                $ref: '#/components/schemas/Beneficiary'

    Beneficiary:
      type: object
      required:
        - AccountId
        - BeneficiaryId
        - Reference
        - CreditorAccount
      properties:
        BeneficiaryId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique beneficiary identifier
          example: "BEN1234567890"
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
          description: Account identifier
        Reference:
          type: string
          maxLength: 35
          description: Reference for payments to this beneficiary
          example: "MONTHLY RENT"
        CreditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        CreditorAccount:
          $ref: '#/components/schemas/AccountIdentification'

    # Direct Debit Schemas
    DirectDebitResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - DirectDebit
          properties:
            DirectDebit:
              type: array
              items:
                $ref: '#/components/schemas/DirectDebit'

    DirectDebit:
      type: object
      required:
        - AccountId
        - DirectDebitId
        - MandateIdentification
        - Name
      properties:
        DirectDebitId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique direct debit identifier
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
        MandateIdentification:
          type: string
          maxLength: 35
          description: Direct debit mandate reference
          example: "DD12345678"
        Name:
          type: string
          maxLength: 70
          description: Name of the originator
          example: "British Gas"
        PreviousPaymentAmount:
          $ref: '#/components/schemas/Amount'
        PreviousPaymentDateTime:
          type: string
          format: date-time
        NextPaymentAmount:
          $ref: '#/components/schemas/Amount'
        NextPaymentDateTime:
          type: string
          format: date-time
        Frequency:
          type: string
          enum:
            - Daily
            - Weekly
            - Fortnightly
            - Monthly
            - Quarterly
            - HalfYearly
            - Annually
        Status:
          type: string
          enum:
            - Active
            - Inactive
            - Cancelled

    # Standing Order Schemas
    StandingOrderResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - StandingOrder
          properties:
            StandingOrder:
              type: array
              items:
                $ref: '#/components/schemas/StandingOrder'

    StandingOrder:
      type: object
      required:
        - AccountId
        - StandingOrderId
        - Frequency
        - Reference
        - FirstPaymentAmount
        - NextPaymentAmount
        - CreditorAccount
      properties:
        StandingOrderId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique standing order identifier
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
        Frequency:
          type: string
          description: Frequency in ISO 20022 format
          example: "Uporzcd"
        Reference:
          type: string
          maxLength: 35
          description: Payment reference
          example: "SAVINGS TRANSFER"
        FirstPaymentDateTime:
          type: string
          format: date-time
        FirstPaymentAmount:
          $ref: '#/components/schemas/Amount'
        NextPaymentDateTime:
          type: string
          format: date-time
        NextPaymentAmount:
          $ref: '#/components/schemas/Amount'
        FinalPaymentDateTime:
          type: string
          format: date-time
        FinalPaymentAmount:
          $ref: '#/components/schemas/Amount'
        CreditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        CreditorAccount:
          $ref: '#/components/schemas/AccountIdentification'
        SupplementaryData:
          type: object

    # Party Schemas
    PartyResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Party
          properties:
            Party:
              $ref: '#/components/schemas/Party'

    Party:
      type: object
      required:
        - PartyId
        - Name
      properties:
        PartyId:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique party identifier
        PartyNumber:
          type: string
          maxLength: 35
          description: Customer number
        PartyType:
          type: string
          enum:
            - Delegate
            - Joint
            - Sole
          description: Type of party relationship
        Name:
          type: string
          maxLength: 350
          description: Full name of the party
          example: "Mr John Smith"
        EmailAddress:
          type: string
          format: email
          maxLength: 256
          description: Email address
        Phone:
          type: string
          maxLength: 35
          description: Phone number
        Mobile:
          type: string
          maxLength: 35
          description: Mobile number
        Address:
          type: array
          items:
            $ref: '#/components/schemas/PostalAddress'

    PostalAddress:
      type: object
      properties:
        AddressType:
          type: string
          enum:
            - Business
            - Correspondence
            - DeliveryTo
            - MailTo
            - POBox
            - Postal
            - Residential
        AddressLine:
          type: array
          maxItems: 7
          items:
            type: string
            maxLength: 70
        StreetName:
          type: string
          maxLength: 70
        BuildingNumber:
          type: string
          maxLength: 16
        PostCode:
          type: string
          maxLength: 16
        TownName:
          type: string
          maxLength: 35
        CountrySubDivision:
          type: string
          maxLength: 35
        Country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2 country code

    # Product Schemas
    ProductResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Product
          properties:
            Product:
              $ref: '#/components/schemas/Product'

    Product:
      type: object
      required:
        - ProductName
        - ProductType
      properties:
        ProductName:
          type: string
          maxLength: 350
          description: Name of the product
          example: "Premier Current Account"
        ProductType:
          type: string
          enum:
            - BusinessCurrentAccount
            - CommercialCreditCard
            - Other
            - PersonalCurrentAccount
            - SMELoan
        ProductId:
          type: string
          maxLength: 40
          description: Internal product identifier
        SecondaryProductId:
          type: string
          maxLength: 70
        Description:
          type: string
          maxLength: 350
        InterestRate:
          type: string
          pattern: '^\d{1,3}(\.\d{1,3})?$'
          description: Interest rate percentage
        InterestRateType:
          type: string
          enum:
            - Fixed
            - Variable
        TierBandSet:
          type: array
          items:
            $ref: '#/components/schemas/TierBandSet'

    TierBandSet:
      type: object
      properties:
        TierBandMethod:
          type: string
          enum:
            - Tiered
            - Whole
        CalculationMethod:
          type: string
          enum:
            - Compound
            - Simple
        Notes:
          type: array
          items:
            type: string
        TierBand:
          type: array
          items:
            $ref: '#/components/schemas/TierBand'

    TierBand:
      type: object
      properties:
        Identification:
          type: string
        TierValueMinimum:
          type: string
          pattern: '^\d{1,13}\.\d{2}$'
        TierValueMaximum:
          type: string
          pattern: '^\d{1,13}\.\d{2}$'
        AER:
          type: string
          pattern: '^\d{1,3}(\.\d{1,3})?$'
        InterestRate:
          type: string
          pattern: '^\d{1,3}(\.\d{1,3})?$'

    # Scheduled Payment Schemas
    ScheduledPaymentResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - ScheduledPayment
          properties:
            ScheduledPayment:
              type: array
              items:
                $ref: '#/components/schemas/ScheduledPayment'

    ScheduledPayment:
      type: object
      required:
        - AccountId
        - ScheduledPaymentId
        - ScheduledType
        - ScheduledDateTime
        - Reference
        - InstructedAmount
        - CreditorAccount
      properties:
        ScheduledPaymentId:
          type: string
          minLength: 1
          maxLength: 40
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
        ScheduledType:
          type: string
          enum:
            - Execution
            - Settlement
        ScheduledDateTime:
          type: string
          format: date-time
        Reference:
          type: string
          maxLength: 35
        InstructedAmount:
          $ref: '#/components/schemas/Amount'
        CreditorAgent:
          $ref: '#/components/schemas/CreditorAgent'
        CreditorAccount:
          $ref: '#/components/schemas/AccountIdentification'

    # Offer Schemas
    OfferResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Offer
          properties:
            Offer:
              type: array
              items:
                $ref: '#/components/schemas/Offer'

    Offer:
      type: object
      required:
        - AccountId
        - OfferId
        - OfferType
        - Description
      properties:
        OfferId:
          type: string
          minLength: 1
          maxLength: 40
        AccountId:
          type: string
          minLength: 1
          maxLength: 40
        OfferType:
          type: string
          enum:
            - BalanceTransfer
            - LimitIncrease
            - MoneyTransfer
            - Other
            - PromotionalRate
        Description:
          type: string
          maxLength: 500
        StartDateTime:
          type: string
          format: date-time
        EndDateTime:
          type: string
          format: date-time
        Amount:
          $ref: '#/components/schemas/Amount'
        Fee:
          $ref: '#/components/schemas/Amount'
        Rate:
          type: string
          pattern: '^\d{1,3}(\.\d{1,3})?$'
        Term:
          type: string
        URL:
          type: string
          format: uri

    # Bulk Balance Response
    BulkBalanceResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Balance
          properties:
            Balance:
              type: array
              items:
                $ref: '#/components/schemas/Balance'

    # Common Schemas
    Links:
      type: object
      properties:
        Self:
          type: string
          format: uri
          description: Link to current resource
        First:
          type: string
          format: uri
          description: Link to first page
        Prev:
          type: string
          format: uri
          description: Link to previous page
        Next:
          type: string
          format: uri
          description: Link to next page
        Last:
          type: string
          format: uri
          description: Link to last page

    Meta:
      type: object
      properties:
        TotalPages:
          type: integer
          description: Total number of pages
        TotalRecords:
          type: integer
          description: Total number of records
        FirstAvailableDateTime:
          type: string
          format: date-time
          description: Earliest available data
        LastAvailableDateTime:
          type: string
          format: date-time
          description: Latest available data

    # Error Schemas (RFC 7807)
    ErrorResponse:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying error type
          example: "https://api.openbanking.ng/errors/insufficient-funds"
        title:
          type: string
          description: Short error title
          example: "Insufficient Funds"
        status:
          type: integer
          description: HTTP status code
          example: 422
        detail:
          type: string
          description: Human-readable explanation
          example: "Account 12345678 has insufficient balance"
        instance:
          type: string
          format: uri
          description: Specific error occurrence
          example: "urn:uuid:123e4567-e89b-12d3-a456-426614174000"
        # Open Banking extensions
        ob_error_code:
          type: string
          description: Open Banking Nigeria specific error code
          example: "NG.OBN.Field.Invalid"
        ob_error_path:
          type: array
          items:
            type: string
          description: Path to field causing error
          example: ["payment.amount"]
        validation_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "transaction.amount"
              error:
                type: string
                example: "exceeds_daily_limit"
              rejected_value:
                type: string
                example: "10000.00"

    # --- Authorization (OAuth2 + PKCE + consent) ---
    ConsentRequestBody:
      type: object
      required:
        - consentId
        - approved
        - permissions
        - accounts
      properties:
        consentId:
          type: string
          format: uuid
        approved:
          type: boolean
        permissions:
          type: array
          items:
            type: string
            enum: [accounts_read, payments_initiate]
        accounts:
          type: array
          items:
            type: string
          description: AccountIds the PSU is approving TPP access to

    ConsentResponse:
      type: object
      properties:
        code:
          type: [string, "null"]
          description: Authorization code, only present when approved is true

    ConsentDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientName:
          type: string
        scope:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              description:
                type: string
              required:
                type: boolean
        expiresAt:
          type: string
          format: date-time
        redirectUri:
          type: string
          format: uri
        status:
          type: string
          enum: [pending, approved, denied]

    TokenRequestBody:
      type: object
      required:
        - grant_type
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token, client_credentials]
        code:
          type: string
          description: Required when grant_type=authorization_code
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        client_secret:
          type: string
        code_verifier:
          type: string
          description: RFC 7636 PKCE verifier, required when grant_type=authorization_code (S256 only)
        refresh_token:
          type: string
          description: Required when grant_type=refresh_token

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
        scope:
          type: string
          example: "accounts_read payments_initiate"

    OpenIdConfiguration:
      type: object
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          example: ["S256"]

    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            description: RFC 7517 JSON Web Key
            properties:
              kty: { type: string, example: "RSA" }
              use: { type: string, example: "sig" }
              alg: { type: string, example: "RS256" }
              kid: { type: string }
              n: { type: string }
              e: { type: string }

    # --- Payments (PISP) ---
    ISO20022Payment:
      type: object
      description: ISO 20022 pain.001-derived single/future-dated payment instruction
      required:
        - messageId
        - creationDateTime
        - debtor
        - creditor
        - instructedAmount
        - remittanceInformation
      properties:
        messageId:
          type: string
        creationDateTime:
          type: string
          format: date-time
        debtor:
          $ref: '#/components/schemas/PaymentParty'
        creditor:
          $ref: '#/components/schemas/PaymentParty'
        instructedAmount:
          $ref: '#/components/schemas/PaymentAmount'
        remittanceInformation:
          type: string

    PaymentParty:
      type: object
      required:
        - name
        - account
      properties:
        name:
          type: string
        account:
          type: object
          required:
            - iban
            - currency
          properties:
            iban:
              type: string
            currency:
              type: string

    PaymentAmount:
      type: object
      required:
        - value
        - currency
      properties:
        value:
          type: number
          format: double
          minimum: 0.01
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: "NGN"

    FuturePaymentRequest:
      allOf:
        - $ref: '#/components/schemas/ISO20022Payment'
        - type: object
          required:
            - executionDate
          properties:
            executionDate:
              type: string
              format: date-time
              description: Must be in the future (PIFT)

    PaymentInitiationResponse:
      type: object
      properties:
        paymentId:
          type: string
        sagaId:
          type: string
        status:
          type: string
          enum: [processing, scheduled]
        idempotencyKey:
          type: string
        executionDate:
          type: string
          format: date-time
        links:
          type: object
          properties:
            status:
              type: string

    PaymentStatusResponse:
      type: object
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [processing, completed, failed, reversed]
        settlementDate:
          type: string
          format: date-time

    PaymentReversalResponse:
      type: object
      properties:
        id:
          type: string

    # --- Access rules (CBN PIST/MIT/PIFT/PAST) ---
    AccessRuleStatus:
      type: object
      properties:
        message:
          type: string

    # --- Statements (PAST) ---
    AccountStatementResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

  parameters:
    AccountId:
      name: AccountId
      in: path
      required: true
      description: Account identifier
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[A-Za-z0-9\-_]+$'
      example: "1234567890"

    x-fapi-interaction-id:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: RFC4122 UID for request tracing
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: "c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    x-fapi-customer-last-logged-time:
      name: x-fapi-customer-last-logged-time
      in: header
      required: false
      description: Customer's last login time
      schema:
        type: string
        format: date-time
        example: "2026-03-09T09:30:00Z"

    x-customer-user-agent:
      name: x-customer-user-agent
      in: header
      required: false
      description: PSU's user agent string
      schema:
        type: string
        maxLength: 500

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key per distinct payment request; replaying the same key returns the original result instead of creating a duplicate payment
      schema:
        type: string
        format: uuid
      example: "a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"

    ConsentId:
      name: X-Consent-ID
      in: header
      required: true
      description: Approved consent identifier returned from POST /auth/consent, scoping which account(s) this call may access
      schema:
        type: string
        format: uuid

    page:
      name: page
      in: query
      required: false
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        example: 50

    from-creation-date:
      name: fromCreationDate
      in: query
      required: false
      description: Filter accounts created after this date
      schema:
        type: string
        format: date-time
        example: "2026-01-01T00:00:00Z"

    to-creation-date:
      name: toCreationDate
      in: query
      required: false
      description: Filter accounts created before this date
      schema:
        type: string
        format: date-time

    from-booking-date:
      name: fromBookingDate
      in: query
      required: false
      description: Filter transactions booked after this date
      schema:
        type: string
        format: date-time
        example: "2026-03-01T00:00:00Z"

    to-booking-date:
      name: toBookingDate
      in: query
      required: false
      description: Filter transactions booked before this date
      schema:
        type: string
        format: date-time
        example: "2026-03-09T23:59:59Z"

    from-statement-date:
      name: fromStatementDate
      in: query
      required: false
      description: Filter transactions on statements after this date
      schema:
        type: string
        format: date

    to-statement-date:
      name: toStatementDate
      in: query
      required: false
      description: Filter transactions on statements before this date
      schema:
        type: string
        format: date

    from-amount:
      name: fromAmount
      in: query
      required: false
      description: Minimum transaction amount
      schema:
        type: number
        minimum: 0
        example: 10.00

    to-amount:
      name: toAmount
      in: query
      required: false
      description: Maximum transaction amount
      schema:
        type: number
        minimum: 0
        example: 1000.00

    credit-debit-indicator:
      name: creditDebitIndicator
      in: query
      required: false
      description: Filter by transaction type
      schema:
        type: string
        enum:
          - Credit
          - Debit
        example: "Credit"

    transaction-status:
      name: status
      in: query
      required: false
      description: Filter by transaction status
      schema:
        type: string
        enum:
          - Booked
          - Pending
        example: "Booked"

    from-scheduled-date:
      name: fromScheduledDate
      in: query
      required: false
      description: Filter scheduled payments after this date
      schema:
        type: string
        format: date-time

    to-scheduled-date:
      name: toScheduledDate
      in: query
      required: false
      description: Filter scheduled payments before this date
      schema:
        type: string
        format: date-time

    account-ids:
      name: accountIds
      in: query
      required: false
      description: Comma-separated list of account IDs
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        maxItems: 10
      example: "1234567890,0987654321"

    balance-types:
      name: balanceTypes
      in: query
      required: false
      description: Comma-separated list of balance types
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - ClosingAvailable
            - ClosingBooked
            - InterimAvailable
            - InterimBooked

  headers:
    x-fapi-interaction-id:
      description: Echoed interaction ID
      schema:
        type: string
        format: uuid
      example: "c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    Location:
      description: Resource URL
      schema:
        type: string
        format: uri

    Sunset:
      description: Deprecation date (RFC 8594)
      schema:
        type: string
        format: date-time
        example: "Sat, 31 Dec 2026 23:59:59 GMT"

  responses:
    # Error responses (RFC 7807)
    400Error:
      description: Bad Request - Malformed syntax
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/invalid-request"
            title: "Invalid Request"
            status: 400
            detail: "Request body contains invalid JSON"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    401Error:
      description: Unauthorized - Invalid or missing credentials
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Authentication challenge
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/unauthorised"
            title: "Unauthorized"
            status: 401
            detail: "Access token is missing or invalid"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    403Error:
      description: Forbidden - Insufficient permissions
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Token does not have required scopes"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    404Error:
      description: Not Found - Resource doesn't exist
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/not-found"
            title: "Not Found"
            status: 404
            detail: "Account not found"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    405Error:
      description: Method Not Allowed
      headers:
        Allow:
          schema:
            type: string
          description: Allowed methods
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    406Error:
      description: Not Acceptable - Unsupported Accept header
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    415Error:
      description: Unsupported Media Type
      headers:
        Accept-Post:
          schema:
            type: string
          description: Supported media types
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    422Error:
      description: Unprocessable Entity - Business validation failed
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/unprocessable-entity"
            title: "Unprocessable Entity"
            status: 422
            detail: "Request failed business validation"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"
            validation_errors:
              - field: "fromBookingDate"
                error: "invalid_date_range"
                detail: "Date range cannot exceed 90 days"

    409Error:
      description: Conflict - Idempotency key reused for a different request, or resource already processed
      headers:
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/conflict"
            title: "Conflict"
            status: 409
            detail: "A request with this Idempotency-Key is already processing"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    429Error:
      description: Too Many Requests - Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/rate-limit-exceeded"
            title: "Rate Limit Exceeded"
            status: 429
            detail: "Too many requests. Please retry after 60 seconds"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

    500Error:
      description: Internal Server Error
      headers:
        Retry-After:
          schema:
            type: integer
          description: Suggested retry delay
        x-fapi-interaction-id:
          $ref: '#/components/headers/x-fapi-interaction-id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            type: "https://api.openbanking.ng/errors/internal-server-error"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred. Please try again later"
            instance: "urn:uuid:c7c8b9a0-1a2b-3c4d-5e6f-7a8b9c0d1e2f"

  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth2 Authorization Code Flow with PKCE (S256 only, FAPI compliant).
        Access tokens issued under this flow are certificate-bound: they
        are only valid when presented together with the same TPP client
        certificate used to obtain them (see `mutualTLS`).
      flows:
        authorizationCode:
          authorizationUrl: https://rs.openbanking.ng/v1/auth/authorize
          tokenUrl: https://rs.openbanking.ng/v1/auth/token
          refreshUrl: https://rs.openbanking.ng/v1/auth/token
          scopes:
            accounts_read: Read account, balance, transaction and statement information
            payments_initiate: Initiate and manage payments
            openid: OpenID Connect scope
            profile: Basic profile information

    mutualTLS:
      type: mutualTLS
      description: |
        Mutual TLS using the TPP's Open Banking Nigeria Registry-enrolled
        transport certificate, required on the `matls.` host for every
        AISP/PISP resource and payment call. Terminated by the mTLS
        gateway in front of the API (see nginx/mtls-gateway.conf) and
        verified against the participant's registry record.

    openIdConnect:
      type: openIdConnect
      openIdConnectUrl: https://rs.openbanking.ng/v1/auth/.well-known/openid-configuration

  examples:
    basic-accounts:
      summary: Basic account information
      value:
        Data:
          Account:
            - AccountId: "1234567890"
              Currency: "GBP"
              AccountType: "Personal"
              AccountSubType: "CurrentAccount"
              Description: "Mr John Smith Personal Account"
              Account:
                - SchemeName: "NG.OBN.SortCodeAccountNumber"
                  Identification: "12345678901234"
                  Name: "Mr John Smith"
        Links:
          Self: "https://api.openbanking.ng/open-banking/v3.1/aisp/accounts"
        Meta:
          TotalPages: 1
          TotalRecords: 1

    detailed-accounts:
      summary: Detailed account information
      value:
        Data:
          Account:
            - AccountId: "1234567890"
              Currency: "GBP"
              AccountType: "Personal"
              AccountSubType: "CurrentAccount"
              Description: "Mr John Smith Personal Account"
              Nickname: "Main Account"
              Account:
                - SchemeName: "NG.OBN.SortCodeAccountNumber"
                  Identification: "12345678901234"
                  Name: "Mr John Smith"
              Servicer:
                SchemeName: "NG.OBN.BICFI"
                Identification: "MIDLGB22"
              Status: "Enabled"
              StatusUpdateDateTime: "2026-01-01T00:00:00Z"
              OpeningDate: "2020-01-15"
        Links:
          Self: "https://api.openbanking.ng/open-banking/v3.1/aisp/accounts"
        Meta:
          TotalPages: 1
          TotalRecords: 1

    recent-transactions:
      summary: Recent transactions
      value:
        Data:
          Transaction:
