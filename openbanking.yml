  # both a valid OAuth2 access token AND the TPP's client certificate
  # (mTLS), matching FAPI/CBN's certificate-bound access token model.
  # Individual public endpoints (e.g. /auth/authorize, /auth/token) override
  # this with `security: []`.
  - oauth2:
      - accounts_read
    mutualTLS: []

