openapi: 3.0.0

info:
  title: Open Banking Account Information API (AIS)
  description: |
    # Account Information API
    This API provides access to account information for authorized Third Party Providers (TPPs).
    
    ## Key Features
    - **Account Discovery**: List accounts with detailed metadata
    - **Transaction History**: Retrieve transactions with rich filtering
    - **Balance Information**: Real-time account balances
    - **Beneficiary Management**: Access payee information
    - **Direct Debits & Standing Orders**: View recurring payments
    
    ## Version Information
    - Current Version: 3.1.6
    - UK Open Banking Compliance: Yes
    - FAPI Compliant: Yes (Read/Write)
    
    ## Important Notes
    - All endpoints require valid OAuth2 tokens with appropriate scopes
    - Use `x-fapi-interaction-id` for request tracing
    - Rate limits apply (see documentation)
    - RFC 7807 error responses for all 4xx/5xx errors
    
    ## Support
    - Developer Portal: [https://developer.bank.com](https://developer.bank.com)
    - API Status: [https://status.bank.com](https://status.bank.com)
    - Email: api-support@bank.com
    
  version: 3.1.6
  termsOfService: https://bank.com/api/terms
  contact:
    name: Open Banking API Support
    email: api-support@bank.com
    url: https://developer.bank.com/support
  license:
    name: Open Banking License
    url: https://www.openbanking.org.uk/terms

servers:
  - url: https://rs.bank.com/open-banking/v3.1/aisp
    description: Production Server (TLS 1.3 required)
  - url: https://matls.rs.bank.com/open-banking/v3.1/aisp
    description: Production Server with mTLS
  - url: https://sandbox.bank.com/open-banking/v3.1/aisp
    description: Sandbox Environment
  - url: https://rs.bank.com/open-banking/v{version}/aisp
    description: Versioned endpoint pattern
    variables:
      version:
        enum:
          - v3.1
          - v3.0
          - v2.0
        default: v3.1
        description: API version

tags:
  - name: Accounts
    description: Account discovery and metadata
  - name: Balances
    description: Account balance information
  - name: Transactions
    description: Transaction history and details
  - name: Beneficiaries
    description: Beneficiary/payee information
  - name: DirectDebits
    description: Direct debit mandates
  - name: StandingOrders
    description: Standing order configurations
  - name: Products
    description: Account product details
  - name: Offers
    description: Account offers and promotions
  - name: Parties
    description: Account holder information
  - name: ScheduledPayments
    description: Future-dated payments

paths:
  /accounts:
    get:
      summary: Get list of accounts
      description: |
        Returns a list of accounts that the PSU has authorised the TPP to access.
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadAccountsBasic` or `ReadAccountsDetail`
        
        ## Pagination
        - Default page size: 50
        - Maximum page size: 200
        - Use `page` and `limit` query parameters
      operationId: getAccounts
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/from-creation-date'
        - $ref: '#/components/parameters/to-creation-date'
      responses:
        '200':
          description: Successfully retrieved accounts
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
            x-pagination-total:
              schema:
                type: integer
                description: Total number of accounts
            x-pagination-page:
              schema:
                type: integer
                description: Current page number
            x-pagination-limit:
              schema:
                type: integer
                description: Page size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              examples:
                basic-accounts:
                  $ref: '#/components/examples/basic-accounts'
                detailed-accounts:
                  $ref: '#/components/examples/detailed-accounts'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '415':
          $ref: '#/components/responses/415Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}:
    get:
      summary: Get specific account details
      description: |
        Returns detailed information for a specific account.
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadAccountsDetail`
      operationId: getAccountById
      tags:
        - Accounts
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          description: Successfully retrieved account details
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '429':
          $ref: '#/components/responses/429Error'
        '500':
          $ref: '#/components/responses/500Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/balances:
    get:
      summary: Get account balances
      description: |
        Returns current and available balances for a specific account.
        
        ## Balance Types
        - **InterimAvailable**: Available balance for transactions
        - **InterimBooked**: Confirmed transactions balance
        - **Expected**: Expected balance including pending items
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadBalances`
      operationId: getAccountBalances
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          description: Successfully retrieved balances
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              example:
                Data:
                  Balance:
                    - AccountId: "1234567890"
                      Amount:
                        Amount: "1500.00"
                        Currency: "GBP"
                      CreditDebitIndicator: "Credit"
                      Type: "InterimAvailable"
                      DateTime: "2026-03-09T10:30:00Z"
                    - AccountId: "1234567890"
                      Amount:
                        Amount: "1425.50"
                        Currency: "GBP"
                      CreditDebitIndicator: "Credit"
                      Type: "InterimBooked"
                      DateTime: "2026-03-09T10:30:00Z"
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '429':
          $ref: '#/components/responses/429Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/transactions:
    get:
      summary: Get account transactions
      description: |
        Returns transaction history for a specific account with comprehensive filtering.
        
        ## Filtering Options
        - **Date range**: `fromBookingDate` and `toBookingDate`
        - **Transaction type**: Credit/Debit filtering
        - **Amount range**: Minimum/maximum amounts
        - **Transaction status**: Booked/Pending
        
        ## Access Scope Requirements
        - Requires `accounts` scope
        - Permissions must include `ReadTransactionsBasic` or `ReadTransactionsDetail`
        
        ## Rate Limiting
        - 100 requests per minute per TPP
        - Maximum date range: 90 days
      operationId: getAccountTransactions
      tags:
        - Transactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/x-fapi-customer-last-logged-time'
        - $ref: '#/components/parameters/x-customer-user-agent'
        - $ref: '#/components/parameters/from-booking-date'
        - $ref: '#/components/parameters/to-booking-date'
        - $ref: '#/components/parameters/from-statement-date'
        - $ref: '#/components/parameters/to-statement-date'
        - $ref: '#/components/parameters/from-amount'
        - $ref: '#/components/parameters/to-amount'
        - $ref: '#/components/parameters/credit-debit-indicator'
        - $ref: '#/components/parameters/transaction-status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved transactions
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
            x-pagination-total:
              schema:
                type: integer
                description: Total number of transactions
            x-pagination-page:
              schema:
                type: integer
                description: Current page number
            x-pagination-limit:
              schema:
                type: integer
                description: Page size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
              examples:
                recent-transactions:
                  $ref: '#/components/examples/recent-transactions'
                paginated-transactions:
                  $ref: '#/components/examples/paginated-transactions'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '422':
          $ref: '#/components/responses/422Error'
        '429':
          $ref: '#/components/responses/429Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/beneficiaries:
    get:
      summary: Get account beneficiaries
      description: Returns list of beneficiaries/payees for an account
      operationId: getAccountBeneficiaries
      tags:
        - Beneficiaries
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved beneficiaries
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/direct-debits:
    get:
      summary: Get direct debit mandates
      description: Returns active direct debit mandates for an account
      operationId: getAccountDirectDebits
      tags:
        - DirectDebits
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved direct debits
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/standing-orders:
    get:
      summary: Get standing orders
      description: Returns active standing orders for an account
      operationId: getAccountStandingOrders
      tags:
        - StandingOrders
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved standing orders
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/offers:
    get:
      summary: Get account offers
      description: Returns current offers and promotions for an account
      operationId: getAccountOffers
      tags:
        - Offers
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved offers
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/party:
    get:
      summary: Get account party information
      description: Returns information about the account holder
      operationId: getAccountParty
      tags:
        - Parties
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved party information
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/scheduled-payments:
    get:
      summary: Get scheduled payments
      description: Returns future-dated scheduled payments for an account
      operationId: getAccountScheduledPayments
      tags:
        - ScheduledPayments
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/from-scheduled-date'
        - $ref: '#/components/parameters/to-scheduled-date'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Successfully retrieved scheduled payments
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledPaymentResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
      security:
        - oauth2:
            - accounts

  /accounts/{AccountId}/product:
    get:
      summary: Get account product details
      description: Returns product information associated with the account
      operationId: getAccountProduct
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/x-fapi-interaction-id'
      responses:
        '200':
          description: Successfully retrieved product details
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
