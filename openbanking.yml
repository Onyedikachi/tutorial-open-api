  /balances:
    get:
      summary: Get bulk balances
      description: Returns balances for multiple accounts in a single request
      operationId: getBulkBalances
      tags:
        - Balances
      parameters:
        - $ref: '#/components/parameters/x-fapi-interaction-id'
        - $ref: '#/components/parameters/account-ids'
        - $ref: '#/components/parameters/balance-types'
      responses:
        '200':
          description: Successfully retrieved bulk balances
          headers:
            x-fapi-interaction-id:
              $ref: '#/components/headers/x-fapi-interaction-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkBalanceResponse'
        '400':
